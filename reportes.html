<section id="reportes" class="content-section">
    <div class="report-header">
        <i class="fas fa-chart-bar main-icon"></i>
        <h1>Reportes y Estadísticas</h1>
    </div>

    <div class="card shadow report-filters-card">
        <div class="card-header">
            <i class="fas fa-filter"></i>
            <h2>Generar Reporte</h2>
        </div>

        <form class="filters-form">
            <div class="input-group">
                <label for="tipo-reporte">Tipo de Reporte</label>
                <select id="tipo-reporte">
                    <option value="ventas">Ventas</option>
                    <option value="inventario">Inventario</option>
                    <option value="entradas">Entradas</option>
                    <option value="salidas">Salidas</option>
                </select>
            </div>

            <div class="input-group">
                <label for="periodo-reporte">Período</label>
                <select id="periodo-reporte">
                    <option value="hoy">Hoy</option>
                    <option value="semana">Esta Semana</option>
                    <option value="mes">Este Mes</option>
                    <option value="anio">Este Año</option>
                </select>
            </div>

            <div class="button-group-reports">
                <button type="button" class="btn btn-export btn-pdf">
                    <i class="fas fa-file-pdf"></i> Generar PDF
                </button>
                <button type="button" class="btn btn-export btn-excel">
                    <i class="fas fa-file-excel"></i> Generar Excel
                </button>
            </div>
        </form>
    </div>

    <div class="card shadow mt-4 report-data-card">
        <div class="card-header">
            <i class="fas fa-table"></i>
            <h2>Datos del Reporte</h2>
        </div>

        <div class="table-responsive">
            <table class="report-table">
                <thead>
                    <tr>
                        <th>FECHA</th>
                        <th>PRODUCTO</th>
                        <th>CANTIDAD</th>
                        <th>TOTAL</th>
                        <th>MÉTODO PAGO</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="empty-msg">
                            Seleccione filtros y haga clic en "Generar PDF/Excel" para visualizar datos.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
