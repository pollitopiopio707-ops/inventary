<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Papelería Rio Grande</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container">

    <!-- ── INICIAR SESIÓN ────────────────────────── -->
    <div class="container-form sign-in">
        <form id="form-login">
            <h2>Iniciar Sesión</h2>
            <div class="social-networks">
                <ion-icon name="logo-twitter"></ion-icon>
                <ion-icon name="logo-facebook"></ion-icon>
                <ion-icon name="logo-instagram"></ion-icon>
                <ion-icon name="logo-tiktok"></ion-icon>
            </div>
            <span>Use su usuario y contraseña</span>

            <div class="msg-error" id="error-login"></div>

            <div class="container-input">
                <ion-icon name="person-outline"></ion-icon>
                <input type="text" id="login-usuario" placeholder="Usuario" required>
            </div>
            <div class="container-input">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" id="login-password" placeholder="Contraseña" required>
            </div>
            <a href="#">¿Olvidaste tu contraseña?</a>
            <button type="submit" class="button" id="btn-login">Iniciar sesión</button>
        </form>
    </div>

    <!-- ── REGISTRARSE ───────────────────────────── -->
    <div class="container-form sign-up">
        <form id="form-registro">
            <h2>Registrarse</h2>
            <span>Coloque sus datos para registrar</span>

            <div class="msg-error"   id="error-registro"></div>
            <div class="msg-success" id="success-registro"></div>

            <div class="container-input">
                <ion-icon name="person-outline"></ion-icon>
                <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
            </div>
            <div class="container-input">
                <ion-icon name="mail-outline"></ion-icon>
                <input type="text" id="reg-usuario" placeholder="Usuario" required>
            </div>
            <div class="container-input">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" id="reg-password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="button" id="btn-registro">Registrarse</button>
        </form>
    </div>

    <!-- ── PANEL BIENVENIDA (animación original) ─── -->
    <div class="container-welcome">
        <div class="welcome-sign-up welcome">
            <h3>BIENVENIDO</h3>
            <p>Ingrese todos los datos para comenzar</p>
            <button class="button" id="btn-sign-up">Registrarse</button>
        </div>
        <div class="welcome-sign-in welcome">
            <h3>HOLA</h3>
            <p>Ingrese sus datos para comenzar</p>
            <button class="button" id="btn-sign-in">Iniciar sesión</button>
        </div>
    </div>

</div>

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script src="js/login.js"></script>

</body>
</html>
